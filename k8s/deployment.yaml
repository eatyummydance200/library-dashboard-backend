apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-dashboard
spec:
  replicas: 2
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: library-dashboard
  template:
    metadata:
      labels:
        app: library-dashboard
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/eatyummydance200/library-dashboard:2c9b0644b58d47d97c1978f45ea9dd8c2cbd4cd0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: MONITORING_SCRAPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-metrics
                  key: token
          envFrom:
            - secretRef:
                name: library-dashboard
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: library-dashboard
spec:
  # The host socket proxy (library-dashboard-proxy) forwards to this fixed IP.
  clusterIP: 10.96.20.10
  selector:
    app: library-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: library-dashboard-metrics
  labels:
    app: library-dashboard-metrics
spec:
  selector:
    app: library-dashboard
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
