apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eatyummydance200/library-dashboard-backend.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: library-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
