server:
  servlet:
    context-path: ${APP_BASE_PATH:/library-dashboard}
    session:
      timeout: 12h
      tracking-modes: cookie
      cookie:
        name: library_dashboard_session
        max-age: 12h
  tomcat:
    threads:
      max: 20

library-dashboard:
  manual:
    # Local folder with manual.md and images/. Empty means no seeding.
    seed-dir: ${MANUAL_SEED_DIR:}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  main:
    banner-mode: "off"
  datasource:
    embedded-database-connection: none
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  session:
    jdbc:
      initialize-schema: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
