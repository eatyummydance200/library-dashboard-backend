server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.servlet.context-path=${APP_BASE_PATH:/library-dashboard}
server.servlet.session.timeout=12h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=library_dashboard_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=12h
server.tomcat.max-http-form-post-size=64KB
server.tomcat.threads.max=20
server.error.include-message=never
spring.web.resources.cache.period=0
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_dashboard}
spring.datasource.username=${DB_USER:library_dashboard}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '15s'
spring.session.jdbc.initialize-schema=never
spring.session.timeout=12h
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
